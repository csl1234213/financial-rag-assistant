# ============================================================
# Financial RAG Assistant — Production Docker Compose
# ============================================================
# Usage:
#   docker compose up          # foreground
#   docker compose up -d       # detached
#   docker compose down        # stop and remove
#   docker compose build       # rebuild images
# ============================================================
# Architecture:
#   frontend   (port 3000)  — React/Vite + Nginx
#   backend    (port 8000)  — FastAPI + Agent Runtime
#   chromadb   (port 8001)  — Vector Database
#   postgres   (port 5432)  — Relational Database (auth, usage, subscriptions)
#   redis      (port 6379)  — Cache & Task Queue
# ============================================================

services:
  # ==========================================================
  # PostgreSQL — Relational Database
  # ==========================================================
  postgres:
    image: postgres:16-alpine
    container_name: financial-postgres
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-financial}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-financial_rag}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - financial_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-financial} -d ${POSTGRES_DB:-financial_rag}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==========================================================
  # Redis — Cache & Task Queue
  # ==========================================================
  redis:
    image: redis:7-alpine
    container_name: financial-redis
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--save",
        "60",
        "1",
        "--save",
        "300",
        "10",
        "--requirepass",
        "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}",
      ]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    networks:
      - financial_network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==========================================================
  # ChromaDB — Vector Database
  # ==========================================================
  chromadb:
    image: chromadb/chroma:1.5.9
    container_name: financial-chromadb
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    networks:
      - financial_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ==========================================================
  # FastAPI Backend
  # ==========================================================
  backend:
    image: financial-rag-assistant-runtime:${APP_VERSION:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: financial-backend
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - uploads_data:/app/storage/uploads
      - agent_memory:/app/storage/memory
      - logs_data:/app/logs
      - huggingface_cache:/home/appuser/.cache/huggingface
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - HF_ENDPOINT=${HF_ENDPOINT:-https://hf-mirror.com}
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-financial}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-financial_rag}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@redis:6379/0
      - AGENT_MEMORY_DIR=/app/storage/memory
      - TRUST_PROXY_HEADERS=true
      - RUN_DATABASE_MIGRATIONS=true
    depends_on:
      chromadb:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - financial_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # ==========================================================
  # React/Vite Frontend (Nginx)
  # ==========================================================
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: /api
    container_name: financial-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - financial_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ==========================================================
  # Agent Worker — Async Agent Task Execution
  # ==========================================================
  agent-worker:
    # API and worker share one immutable runtime image. This avoids exporting
    # duplicate multi-GB ML dependency layers during local and CI builds.
    image: financial-rag-assistant-runtime:${APP_VERSION:-latest}
    command: ["python", "-m", "workers.agent_worker"]
    volumes:
      - uploads_data:/app/storage/uploads
      - agent_memory:/app/storage/memory
      - logs_data:/app/logs
      - huggingface_cache:/home/appuser/.cache/huggingface
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - HF_ENDPOINT=${HF_ENDPOINT:-https://hf-mirror.com}
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-financial}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-financial_rag}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@redis:6379/0
      - AGENT_MEMORY_DIR=/app/storage/memory
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-2}
      - WORKER_POLL_TIMEOUT=${WORKER_POLL_TIMEOUT:-1.0}
      - MAX_TASK_RUNTIME=${MAX_TASK_RUNTIME:-3600}
      - RUN_DATABASE_MIGRATIONS=false
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    networks:
      - financial_network
    healthcheck:
      test: ["CMD", "python", "-m", "workers.agent_worker", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

volumes:
  chroma_data:
    name: financial_chroma_data
  uploads_data:
    name: financial_uploads
  logs_data:
    name: financial_logs
  postgres_data:
    name: financial_postgres_data
  redis_data:
    name: financial_redis_data
  agent_memory:
    name: financial_agent_memory
  huggingface_cache:
    name: financial_huggingface_cache

networks:
  financial_network:
    driver: bridge
    name: financial_network
