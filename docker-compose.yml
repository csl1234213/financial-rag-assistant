# ============================================================
# Financial RAG Assistant — Production Docker Compose
# ============================================================
# Usage:
#   docker compose up          # foreground
#   docker compose up -d       # detached
#   docker compose down        # stop and remove
#   docker compose build       # rebuild images
# ============================================================
# Architecture:
#   frontend   (port 3000)  — React/Vite + Nginx
#   backend    (port 8000)  — FastAPI + Agent Runtime
#   chromadb   (port 8001)  — Vector Database
#   postgres   (port 5432)  — Relational Database (auth, usage, subscriptions)
#   redis      (port 6379)  — Cache & Task Queue
# ============================================================

services:
  # ==========================================================
  # PostgreSQL — Relational Database
  # ==========================================================
  postgres:
    image: postgres:16-alpine
    container_name: financial-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-financial}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-financial_secret}
      POSTGRES_DB: ${POSTGRES_DB:-financial_rag}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - financial_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-financial} -d ${POSTGRES_DB:-financial_rag}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==========================================================
  # Redis — Cache & Task Queue
  # ==========================================================
  redis:
    image: redis:7-alpine
    container_name: financial-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - financial_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==========================================================
  # ChromaDB — Vector Database
  # ==========================================================
  chromadb:
    image: chromadb/chroma:0.6.3
    container_name: financial-chromadb
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    networks:
      - financial_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ==========================================================
  # FastAPI Backend
  # ==========================================================
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: financial-backend
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/storage/uploads
      - chroma_local:/app/chroma_db
      - agent_memory:/app/storage/memory
      - logs_data:/app/logs
      - ${USERPROFILE:-~}/.cache/huggingface:/home/appuser/.cache/huggingface
    env_file:
      - .env
    environment:
      - HF_ENDPOINT=${HF_ENDPOINT:-https://hf-mirror.com}
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - DATABASE_URL=${DATABASE_URL:-postgresql://financial:financial_secret@postgres:5432/financial_rag}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - AGENT_MEMORY_DIR=/app/storage/memory
    depends_on:
      chromadb:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - financial_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # ==========================================================
  # React/Vite Frontend (Nginx)
  # ==========================================================
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: /api
    container_name: financial-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - financial_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  chroma_data:
    name: financial_chroma_data
  chroma_local:
    name: financial_chroma_local
  uploads_data:
    name: financial_uploads
  logs_data:
    name: financial_logs
  postgres_data:
    name: financial_postgres_data
  redis_data:
    name: financial_redis_data
  agent_memory:
    name: financial_agent_memory

networks:
  financial_network:
    driver: bridge
    name: financial_network