# ============================================================
# Financial Agent Runtime Assistant — Production Deploy
# ============================================================
# Usage:
#   docker compose up
#   docker compose up -d
#   docker compose down
# ============================================================
# Architecture:
#   financial-api  (port 8000)  — FastAPI + Agent Runtime
#   financial-ui   (port 8501)  — Streamlit UI
# ============================================================

services:
  # ---------- FastAPI Backend ----------
  financial-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: financial-api
    ports:
      - "8000:8000"
    volumes:
      - financial_uploads:/app/storage/uploads
      - financial_chroma:/app/chroma_db
      - financial_logs:/app/logs
      - ${USERPROFILE}/.cache/huggingface:/home/appuser/.cache/huggingface
    env_file:
      - .env
    environment:
      - HF_ENDPOINT=https://hf-mirror.com
    networks:
      - financial_network

  # ---------- Streamlit Frontend ----------
  financial-ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.ui
    container_name: financial-ui
    ports:
      - "8501:8501"
    volumes:
      - financial_uploads:/app/storage/uploads:ro
    environment:
      - API_BASE_URL=http://financial-api:8000
    depends_on:
      financial-api:
        condition: service_healthy
    networks:
      - financial_network

volumes:
  financial_uploads:
  financial_chroma:
  financial_logs:

networks:
  financial_network:
    driver: bridge