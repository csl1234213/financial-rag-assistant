# ============================================================
# Financial RAG Assistant — Nginx Config (Frontend)
# ============================================================
# Serves React/Vite SPA on port 3000
# Proxies /api/* to backend on port 8000
# ============================================================

limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=60r/m;

server {
    listen 3000;
    server_name _;
    client_max_body_size 50m;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain application/json application/javascript text/css text/xml image/svg+xml;

    # Root for static files
    root /usr/share/nginx/html;
    index index.html;

    # ---- API Proxy ----
    location /api/ {
        limit_req zone=api_per_ip burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # ---- SPA Fallback ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Static Asset Caching ----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
